<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Host simulado (MCP Apps)</title>
<style>
  body { margin: 0; padding: 24px; background: #f4f4f5; font-family: system-ui, sans-serif; }
  #frame { width: 760px; border: 0; display: block; background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); height: 200px; }
  body.fs { padding: 0; }
  body.fs #frame { width: 100vw; height: 100vh; border-radius: 0; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: #555; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="frame" src="/widget" title="widget"></iframe>
<div id="log"></div>
<script type="module">
  import * as fx from '/fixtures.mjs';
  const q = new URLSearchParams(location.search);
  const kind = q.get('k') || 'slides';
  const tool = { slides: 'mythos_render_slides', site: 'mythos_render_site', html: 'mythos_render_html' }[kind];
  const args = { slides: fx.deck, site: fx.site, html: fx.html }[kind];
  const frame = document.getElementById('frame');
  const logEl = document.getElementById('log');
  const log = (s) => { logEl.textContent += s + '\n'; window.__log = logEl.textContent; };
  window.__events = [];

  async function callTool() {
    const r = await fetch('/mcp', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name: tool, arguments: args } }) });
    const j = await r.json();
    return j.result;
  }
  const resultP = callTool();
  const post = (m) => frame.contentWindow.postMessage(m, '*');

  window.addEventListener('message', async (ev) => {
    if (ev.source !== frame.contentWindow) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    window.__events.push(m.method || ('response:' + m.id));
    if (m.method === 'ui/initialize') {
      log('<- ui/initialize ' + JSON.stringify(m.params.appInfo));
      post({ jsonrpc: '2.0', id: m.id, result: { protocolVersion: '2026-01-26', hostInfo: { name: 'harness', version: '1' }, hostCapabilities: { openLinks: {} }, hostContext: { theme: 'light', displayMode: 'inline', availableDisplayModes: ['inline', 'fullscreen'] } } });
    } else if (m.method === 'ui/notifications/initialized') {
      log('<- initialized');
      post({ jsonrpc: '2.0', method: 'ui/notifications/tool-input', params: { arguments: args } });
      const result = await resultP;
      log('-> tool-result viewUrl ' + (result.structuredContent.viewUrl.length) + ' chars');
      post({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: result });
    } else if (m.method === 'ui/notifications/size-changed') {
      log('<- size-changed ' + m.params.width + 'x' + m.params.height);
      if (!document.body.classList.contains('fs')) frame.style.height = m.params.height + 'px';
    } else if (m.method === 'ui/request-display-mode') {
      log('<- request-display-mode ' + m.params.mode);
      document.body.classList.toggle('fs', m.params.mode === 'fullscreen');
      frame.style.height = m.params.mode === 'fullscreen' ? '100vh' : '';
      post({ jsonrpc: '2.0', id: m.id, result: { mode: m.params.mode } });
      post({ jsonrpc: '2.0', method: 'ui/notifications/host-context-changed', params: { displayMode: m.params.mode } });
    } else if (m.method === 'ui/open-link') {
      log('<- open-link ' + m.params.url.slice(0, 60) + '…');
      window.__openedLink = m.params.url;
      post({ jsonrpc: '2.0', id: m.id, result: {} });
    } else if (m.id != null && m.method) {
      post({ jsonrpc: '2.0', id: m.id, result: {} });
    }
  });
</script>
</body>
</html>
